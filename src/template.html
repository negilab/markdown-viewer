<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1: iPhone で入力欄に触れたときに勝手に拡大しないように（指での拡大はできる） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Markdown Viewer</title>
<meta name="description" content="Markdownを読みやすく表示し、記号を覚えずにそのまま書き直せます。PCでもiPhoneでも使えます。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- 色 ---------- */
:root{
  color-scheme:light;
  --bg:#ffffff; --bg-sub:#f7f8fa; --bg-sunken:#eef0f4; --bg-elev:#ffffff;
  --fg:#1f2328; --fg-muted:#61697a; --fg-faint:#8b93a3;
  --border:#dfe3e9; --border-strong:#c6ccd6;
  --accent:#2f6feb; --accent-soft:#e8effd; --accent-fg:#ffffff;
  --shadow-sm:0 1px 2px rgba(16,22,34,.06), 0 1px 3px rgba(16,22,34,.05);
  --shadow-md:0 6px 20px rgba(16,22,34,.10), 0 2px 6px rgba(16,22,34,.06);
  --sans:"Inter", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", "BIZ UDGothic", Menlo, monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1216; --bg-sub:#14181e; --bg-sunken:#0b0e12; --bg-elev:#171c23;
  --fg:#dfe3ea; --fg-muted:#9aa4b4; --fg-faint:#6d7787;
  --border:#262d37; --border-strong:#38414e;
  --accent:#6ea1ff; --accent-soft:#17233a; --accent-fg:#0f1216;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    color-scheme:dark;
    --bg:#0f1216; --bg-sub:#14181e; --bg-sunken:#0b0e12; --bg-elev:#171c23;
    --fg:#dfe3ea; --fg-muted:#9aa4b4; --fg-faint:#6d7787;
    --border:#262d37; --border-strong:#38414e;
    --accent:#6ea1ff; --accent-soft:#17233a; --accent-fg:#0f1216;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45);
  }
}

*,*::before,*::after{box-sizing:border-box}
/* 高さを画面に固定すると、1画面ぶん下へ進んだところで上の帯が外れて流れていくので min-height にする */
html,body{min-height:100%}
/* 画面より広いものがあっても、ページ全体は左右に動かさない（clip はスクロールの箱を作らないので、上の帯の sticky も効いたまま） */
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}

/* ---------- 上のバー ---------- */
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  /* iPhone でキーボードが出ると、見えている範囲だけ下へずれる。そのずれ（--vv）だけ下げて、見えている上端に合わせる */
  transform:translateY(var(--vv, 0px));
  height:46px;padding:0 12px;padding-top:env(safe-area-inset-top);
  background:var(--bg-elev);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);
}
/* いま開いているファイル（フォルダ / 名前）。押すと開いているファイルの一覧が出る */
.crumb-wrap{flex:1;min-width:0;position:relative;display:flex}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;height:32px;padding:0 8px;border-radius:8px;font-size:13.5px;color:var(--fg-muted);text-align:left}
.crumb:hover{background:var(--bg-sub)}
.crumb .gd svg{width:14px;height:14px;display:block}
.crumb .fold{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30%;flex:none}
.crumb .slash{color:var(--fg-faint)}
.crumb .nm{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.crumb .car{width:14px;height:14px;color:var(--fg-faint);flex:none}
.files-menu{left:0;right:auto;top:38px;min-width:280px;max-width:min(360px, calc(100vw - 20px))}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 10px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);color:var(--fg-muted);font-size:12.5px;white-space:nowrap;
}
.btn:hover{background:var(--bg-sub);color:var(--fg);border-color:var(--border-strong)}
.btn.icon{width:30px;padding:0}
.btn svg{width:15px;height:15px}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.btn:disabled{opacity:.4;cursor:default}
#btnSave.dirty{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.open-wrap{position:relative;display:inline-flex}
.menu{
  position:absolute;top:36px;right:0;z-index:40;min-width:230px;padding:5px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);
}
.menu button{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;font-size:13.5px;color:var(--fg)}
.menu button:hover{background:var(--bg-sub)}
.menu small{display:block;font-size:11px;color:var(--fg-faint);margin-top:2px}

/* ---------- 編集部品の色と文字をこの画面に合わせる（部品のテーマより後に効くよう .wrap を付ける） ---------- */
.wrap .milkdown{
  --crepe-color-background:var(--bg);
  --crepe-color-on-background:var(--fg);
  --crepe-color-surface:var(--bg-sub);
  --crepe-color-surface-low:var(--bg-sunken);
  --crepe-color-on-surface:var(--fg);
  --crepe-color-on-surface-variant:var(--fg-muted);
  --crepe-color-outline:var(--border-strong);
  --crepe-color-primary:var(--accent);
  --crepe-color-secondary:var(--accent-soft);
  --crepe-color-on-secondary:var(--fg);
  --crepe-color-inverse:var(--fg);
  --crepe-color-on-inverse:var(--bg);
  --crepe-color-inline-code:#d1405b;
  --crepe-color-hover:var(--bg-sub);
  --crepe-color-selected:var(--accent-soft);
  --crepe-color-inline-area:var(--bg-sunken);
  --crepe-font-title:var(--sans);
  --crepe-font-default:var(--sans);
  --crepe-font-code:var(--mono);
  --crepe-shadow-1:var(--shadow-sm);
  --crepe-shadow-2:var(--shadow-md);
  --crepe-base-font-size:var(--fs, 15px);
}
/* 本文の幅は設定で変えられる（--cw） */
.wrap{max-width:var(--cw, 860px);margin:0 auto;padding:16px 0 40vh}
.wrap .milkdown .ProseMirror{padding:20px 56px 60px 80px;line-height:1.8;font-size:var(--fs, 15px)}
/* 長いパスや URL で画面より広がらないように折り返す */
.wrap .milkdown .ProseMirror{overflow-wrap:anywhere}
.wrap .milkdown .ProseMirror code{overflow-wrap:anywhere;word-break:break-all}
.wrap .milkdown .ProseMirror h1,.wrap .milkdown .ProseMirror h2{border-bottom:1px solid var(--border);padding-bottom:.3em;font-weight:700;letter-spacing:.01em}
.wrap .milkdown .ProseMirror h1{font-size:1.72em;line-height:1.35;margin-top:6px}
.wrap .milkdown .ProseMirror h2{font-size:1.33em;line-height:1.4;margin-top:24px}
.wrap .milkdown .ProseMirror h3{font-size:1.13em;font-weight:700;margin-top:20px}

/* 箇条書き: 記号と文の間を詰める */
.wrap .milkdown .milkdown-list-item-block li{gap:3px}
.wrap .milkdown .milkdown-list-item-block li .label-wrapper,
.wrap .milkdown .milkdown-list-item-block li .label-wrapper .label{width:18px}
/* 番号付きは「12.」のような2桁でも折り返さないよう、幅を固定せず右寄せにする（「.」の位置と本文の書き出しがそろう） */
.wrap .milkdown .milkdown-list-item-block li .label-wrapper:has(.label.ordered),
.wrap .milkdown .milkdown-list-item-block li .label-wrapper .label.ordered{width:auto;min-width:1.8em;white-space:nowrap;justify-content:flex-end;text-align:right}

/* 表: 細かく折り返さず、表の中だけ左右にスクロールする */
.wrap .milkdown .milkdown-table-block .table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wrap .milkdown .milkdown-table-block table{width:max-content;min-width:100%}
.wrap .milkdown .milkdown-table-block th,.wrap .milkdown .milkdown-table-block td{min-width:7em;max-width:22em;overflow-wrap:normal;word-break:normal}

/* 書式のバー（iPhone）: 箇条書き・挿入などのボタンは最初から黒。
   文字の書式（太字・斜体・取り消し線・コード。見出しの選択と区切り線に続く 3〜6 番目）だけは、オフは灰色・オンで色が付く */
.wrap .milkdown .milkdown-top-bar .top-bar-item svg{color:var(--fg);fill:var(--fg)}
.wrap .milkdown .milkdown-top-bar .top-bar-inner > .top-bar-item:nth-child(-n+6):not(.active) svg{color:var(--crepe-color-outline);fill:var(--crepe-color-outline)}
.wrap .milkdown .milkdown-top-bar .top-bar-item.active svg{color:var(--crepe-color-primary);fill:var(--crepe-color-primary)}

/* 設定メニュー（文字の大きさ・テーマ） */
.cfg-wrap{position:relative;display:inline-flex}
.menu .row{padding:6px 8px 8px}
.menu .row > span{display:block;font-size:11.5px;color:var(--fg-faint);margin-bottom:5px}
.seg2{display:flex;gap:2px;background:var(--bg-sunken);padding:2px;border-radius:8px}
.menu .seg2 button{flex:1;text-align:center;padding:6px 0;border-radius:6px;font-size:12.5px;color:var(--fg-muted)}
@media (max-width:820px){ .menu .pc-only{display:none} }
.menu .ver{padding:6px 11px 4px;font-size:11px;color:var(--fg-faint);border-top:1px solid var(--border);margin-top:4px}
.menu .seg2 button.on{background:var(--bg-elev);color:var(--fg);font-weight:600;box-shadow:var(--shadow-sm)}

/* 段落をつかんだとき：標準の選択色（ずれた灰色）を消して、ブロック全体を淡く塗る */
.wrap .milkdown .ProseMirror .ProseMirror-selectednode{
  outline:none;background:var(--accent-soft);border-radius:6px;box-shadow:0 0 0 3px var(--accent-soft);
}
.wrap .milkdown .ProseMirror .ProseMirror-selectednode::after{display:none}
.wrap .milkdown .ProseMirror-hideselection,
.wrap .milkdown .ProseMirror-hideselection *{caret-color:transparent}
.wrap .milkdown .ProseMirror-hideselection *::selection{background:transparent}
.wrap .milkdown .ProseMirror-hideselection *::-moz-selection{background:transparent}

/* 閲覧中：書式のバーと ⋮⋮ を隠す */
body.readonly .milkdown .milkdown-top-bar,
body.readonly .milkdown .milkdown-block-handle{display:none !important}
.foot{max-width:var(--cw, 860px);margin:0 auto;padding:0 80px 40px;font-size:12px;color:var(--fg-faint)}

/* ---------- PC の左パネル（開いているファイル・目次・書式） ---------- */
:root{--side:#f7f7f5; --side-line:#ebebe8; --side-hover:#ececea; --side-active:#e6e6e3}
:root[data-theme="dark"]{--side:#17191d; --side-line:#262a31; --side-hover:#22262c; --side-active:#2a2e35}
@media (prefers-color-scheme:dark){ :root[data-theme="auto"]{--side:#17191d; --side-line:#262a31; --side-hover:#22262c; --side-active:#2a2e35} }
#btnPanel{display:none}
body.can-panel #btnPanel{display:inline-flex}
/* パネルがあるときは、開く・作成はパネルから */
body.has-panel .top-file{display:none !important}
.panel{
  position:fixed;left:0;top:46px;bottom:0;width:268px;z-index:25;display:flex;flex-direction:column;
  padding:10px 8px 8px;background:var(--side);border-right:1px solid var(--side-line);font-size:13.5px;
}
body:not(.has-panel) .panel{display:none}
body.has-panel .wrap,body.has-panel .foot{
  margin-left:max(284px, calc((100% - var(--cw, 860px)) / 2 + 134px));
  max-width:min(var(--cw, 860px), calc(100% - 300px));
}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.p-sec{min-height:0;margin-bottom:12px}
.p-files{flex:none;max-height:38vh;display:flex;flex-direction:column}
.p-files .rows{overflow-y:auto;min-height:0}
.p-toc{flex:1;display:flex;flex-direction:column}
.p-toc nav{overflow-y:auto;min-height:0;flex:1}
.p-head{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 8px;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--fg-muted);flex:none}
.p-act{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--fg-muted)}
.p-act:hover{background:var(--side-hover);color:var(--fg)}
.p-act .ic{width:14px;height:14px}
/* 1行ずつのファイル */
.frow{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 6px 0 8px;border-radius:7px;color:var(--fg);text-align:left;cursor:pointer;position:relative}
.frow:hover{background:var(--side-hover)}
.frow.on{background:var(--side-active);font-weight:500}
.frow > .ic{color:var(--fg-faint)}
.frow.on > .ic{color:var(--fg-muted)}
.frow .gd svg{width:14px;height:14px;display:block}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .cnt{font-size:11px;font-weight:600;color:var(--chg);background:color-mix(in srgb, var(--chg) 12%, transparent);border-radius:999px;padding:1px 7px;flex:none}
.frow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.frow .x{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--fg-muted);flex:none;visibility:hidden}
.frow .x .ic{width:13px;height:13px}
.frow .x:hover{background:var(--side-active);color:var(--fg)}
.frow:hover .x,.frow.on .x,.menu .frow .x{visibility:visible}
.frow.add{color:var(--fg-muted)}
.frow.add > .ic{color:var(--fg-muted)}
.p-open{position:relative}
.p-open .menu{left:8px;right:auto;top:32px}
.menu .frow{height:36px}
.menu .frow:hover{background:var(--bg-sub)}
.menu .frow.on{background:var(--bg-sunken)}
/* 目次 */
#toc a{display:block;position:relative;height:28px;line-height:28px;padding:0 8px;border-radius:7px;color:var(--fg);text-decoration:none;cursor:pointer;
  font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc a:hover{background:var(--side-hover)}
#toc a.l2{padding-left:22px}
#toc a.l3{padding-left:36px;font-size:12.5px;color:var(--fg-muted)}
#toc a.cur{color:var(--accent);font-weight:500}
#toc a.cur::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
#toc .none{color:var(--fg-faint);font-size:12px;padding:2px 8px;line-height:1.7}
/* 書式（下にまとめた枠） */
.dock{flex:none;background:var(--bg-elev);border:1px solid var(--side-line);border-radius:12px;padding:8px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.seg{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:2px;background:var(--side);padding:2px;border-radius:8px;margin-bottom:6px}
.seg button{height:26px;border-radius:6px;font-size:12px;font-weight:600;color:var(--fg-muted)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--bg-elev);color:var(--fg);box-shadow:var(--shadow-sm)}
.tools{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.t{height:32px;display:grid;place-items:center;border-radius:7px;color:var(--fg);position:relative}
.t .ic{width:17px;height:17px}
.t:hover{background:var(--side-hover)}
.t.on{background:var(--accent-soft);color:var(--accent)}
.dock hr{border:0;height:1px;background:var(--side-line);margin:5px 4px}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ins button{height:30px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:7px;font-size:12px;color:var(--fg)}
.ins button .ic{width:15px;height:15px;color:var(--fg-muted)}
.ins button:hover{background:var(--side-hover)}
/* 名前とショートカットの吹き出し（重ねたときに出る） */
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:40;
  padding:5px 8px;border-radius:6px;background:var(--fg);color:var(--bg);font-size:11.5px;font-weight:500;line-height:1.3;white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.tools [data-tip]:nth-child(-n+2):hover::after{left:0;transform:none}
.tools [data-tip]:nth-child(n+6):hover::after{left:auto;right:0;transform:none}
.p-head [data-tip]:hover::after{bottom:auto;top:calc(100% + 6px);left:auto;right:0;transform:none}
.p-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 8px 0;font-size:11.5px;color:var(--fg-muted);flex:none}
body.readonly .panel .edit-only{display:none}

/* ---------- パスから開くときのカード ---------- */
.pathcard{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:16px;background:rgba(15,18,22,.35)}
.pathcard[hidden]{display:none}
.pc-box{width:min(420px,100%);background:var(--bg-elev);border-radius:14px;box-shadow:var(--shadow-md);padding:18px 18px 14px}
.pc-body b{display:block;font-size:16px;margin-bottom:2px;overflow-wrap:anywhere}
.pc-body small{display:block;font-size:11.5px;color:var(--fg-faint);overflow-wrap:anywhere;margin-bottom:10px}
.pc-body p{margin:0 0 12px;font-size:13.5px;line-height:1.7;color:var(--fg-muted)}
.pc-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.pc-btns .btn{width:auto;height:36px;padding:0 14px;font-size:13.5px}
.pc-btns .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}

/* ---------- Googleドライブから開く（一覧） ---------- */
.pc-box.sheet{width:min(560px,100%);max-height:min(680px, calc(100dvh - 32px));display:flex;flex-direction:column;padding:0;overflow:hidden}
.ds-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px}
.ds-head b{font-size:16px}
.ds-head .btn{width:auto;height:32px;padding:0 12px;font-size:13px}
.ds-search{padding:0 16px 10px;border-bottom:1px solid var(--border)}
.ds-search label{display:block;font-size:12px;color:var(--fg-muted);margin-bottom:5px}
.ds-search input{width:100%;height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.ds-search input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.ds-search small{display:block;font-size:11.5px;color:var(--fg-faint);margin-top:6px}
.ds-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 10px;flex:1;min-height:120px}
.ds-item{display:block;width:100%;text-align:left;padding:10px 10px;border-radius:9px}
.ds-item:hover{background:var(--bg-sub)}
.ds-item b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.ds-item small{display:block;font-size:12px;color:var(--fg-faint);margin-top:2px;overflow-wrap:anywhere}
.ds-note{margin:14px 10px;font-size:13.5px;line-height:1.7;color:var(--fg-muted)}
@media (max-width:820px){
  /* スマホは上に寄せる（キーボードが出ても、探す欄と一覧の頭が見えるように） */
  #driveSheet{place-items:start center;padding:12px 10px}
  .pc-box.sheet{max-height:calc(100dvh - 24px)}
}

/* ---------- 前に見たときから変わった所 ---------- */
:root{--chg:#c2410c}
:root[data-theme="dark"]{--chg:#fb923c}
@media (prefers-color-scheme:dark){ :root[data-theme="auto"]{--chg:#fb923c} }
.wrap .milkdown .ProseMirror .chg,.wrap .milkdown .ProseMirror .chg *{color:var(--chg)}
.wrap .milkdown .ProseMirror .chg{background:color-mix(in srgb, var(--chg) 10%, transparent);border-radius:3px}
.wrap .milkdown .ProseMirror .chg-node{outline:2px solid var(--chg);outline-offset:2px;border-radius:6px}
.wrap .milkdown .ProseMirror .chg-del{display:inline-block;box-sizing:content-box;margin:0 4px 0 8px;padding:0 8px;border:1px solid var(--chg);border-radius:999px;
  font-size:11px;font-weight:600;line-height:18px;letter-spacing:0;text-indent:0;vertical-align:2px;color:var(--chg);background:var(--bg);
  user-select:none;-webkit-user-select:none;white-space:nowrap;cursor:default}
.chgbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:55;
  display:flex;align-items:center;gap:8px;max-width:calc(100% - 20px);padding:7px 8px 7px 14px;
  background:var(--bg-elev);border:1px solid var(--chg);border-radius:999px;box-shadow:var(--shadow-md);font-size:13px;white-space:nowrap}
.chgbar[hidden]{display:none}
.chgbar #chgText{color:var(--chg);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.chgbar .btn{width:auto;height:30px;padding:0 11px;border-radius:999px;font-size:12.5px}
@media (min-width:821px){ body.has-chg .toast{bottom:76px} }
@media (max-width:820px){
  .chgbar{font-size:12px;gap:6px;padding:6px 6px 6px 12px}
  .chgbar .btn{padding:0 9px;font-size:12px}
}

/* ---------- ドロップ・お知らせ ---------- */
.dropzone{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:color-mix(in srgb, var(--bg) 80%, transparent);border:3px dashed var(--accent)}
.dropzone.on{display:grid}
.dropzone p{font-size:18px;font-weight:700;color:var(--accent)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:70;
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- スマホ ---------- */
@media (max-width:820px){
  .top{gap:4px;padding:0 8px;height:44px}
  .btn .label,.sep{display:none}
  .crumb .fold,.crumb .slash{display:none}
  .btn{width:32px;height:30px;padding:0}
  .wrap{padding-top:4px}
  .wrap .milkdown .ProseMirror{padding:12px 16px 60px 46px;line-height:1.75}
  .wrap .milkdown .ProseMirror h1{font-size:1.47em}
  .wrap .milkdown .ProseMirror h2{font-size:1.2em;margin-top:20px}
  .wrap .milkdown .ProseMirror h3{font-size:1.07em}
  /* ⋮⋮ だけにして（「＋」は「/」で代わりになる）、左の余白に収める */
  .wrap .milkdown .milkdown-block-handle .operation-item:first-child{display:none}
  .wrap .milkdown .milkdown-block-handle .operation-item{width:26px;height:28px;padding:2px 1px}
  .wrap .milkdown .milkdown-block-handle .operation-item svg{width:22px;height:22px}
  .foot{padding:0 16px 40px}
  .toast{bottom:auto;top:54px;transform:translate(-50%,-10px)}
  /* 書式のバー（TopBar）は、上のバーのすぐ下に貼りつける */
  .wrap .milkdown .milkdown-top-bar{position:sticky;top:44px;z-index:20;min-height:0;transform:translateY(var(--vv, 0px))}
  .wrap .milkdown .milkdown-top-bar{padding:1px 4px}
  .wrap .milkdown .milkdown-top-bar .top-bar-item{margin:1px;width:30px;height:30px;padding:3px}
  .wrap .milkdown .milkdown-top-bar .top-bar-item svg{width:22px;height:22px}
  .wrap .milkdown .milkdown-top-bar .top-bar-heading-button{height:28px}
  .wrap .milkdown .milkdown-top-bar .top-bar-divider{margin:4px 3px}
  .wrap .milkdown .milkdown-top-bar .top-bar-heading-selector{padding:1px}
}
</style>
