<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1: iPhone で入力欄に触れたときに勝手に拡大しないように（指での拡大はできる） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Markdown Viewer</title>
<meta name="description" content="Markdownを読みやすく表示し、記号を覚えずにそのまま書き直せます。PCでもiPhoneでも使えます。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- 色 ---------- */
:root{
  color-scheme:light;
  --bg:#ffffff; --bg-sub:#f7f8fa; --bg-sunken:#eef0f4; --bg-elev:#ffffff;
  --fg:#1f2328; --fg-muted:#61697a; --fg-faint:#8b93a3;
  --border:#dfe3e9; --border-strong:#c6ccd6;
  --accent:#2f6feb; --accent-soft:#e8effd; --accent-fg:#ffffff;
  --shadow-sm:0 1px 2px rgba(16,22,34,.06), 0 1px 3px rgba(16,22,34,.05);
  --shadow-md:0 6px 20px rgba(16,22,34,.10), 0 2px 6px rgba(16,22,34,.06);
  --sans:"Inter", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", "BIZ UDGothic", Menlo, monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1216; --bg-sub:#14181e; --bg-sunken:#0b0e12; --bg-elev:#171c23;
  --fg:#dfe3ea; --fg-muted:#9aa4b4; --fg-faint:#6d7787;
  --border:#262d37; --border-strong:#38414e;
  --accent:#6ea1ff; --accent-soft:#17233a; --accent-fg:#0f1216;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    color-scheme:dark;
    --bg:#0f1216; --bg-sub:#14181e; --bg-sunken:#0b0e12; --bg-elev:#171c23;
    --fg:#dfe3ea; --fg-muted:#9aa4b4; --fg-faint:#6d7787;
    --border:#262d37; --border-strong:#38414e;
    --accent:#6ea1ff; --accent-soft:#17233a; --accent-fg:#0f1216;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45);
  }
}

*,*::before,*::after{box-sizing:border-box}
/* 高さを画面に固定すると、1画面ぶん下へ進んだところで上の帯が外れて流れていくので min-height にする */
html,body{min-height:100%}
/* 画面より広いものがあっても、ページ全体は左右に動かさない（clip はスクロールの箱を作らないので、上の帯の sticky も効いたまま） */
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}

/* ---------- 上のバー ---------- */
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  /* iPhone でキーボードが出ると、見えている範囲だけ下へずれる。そのずれ（--vv）だけ下げて、見えている上端に合わせる */
  transform:translateY(var(--vv, 0px));
  height:46px;padding:0 12px;padding-top:env(safe-area-inset-top);
  background:var(--bg-elev);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;color:var(--fg)}
.brand{font-size:14px}
.brand svg{width:20px;height:20px;color:var(--accent)}
.name{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.name .dot{color:var(--accent);font-size:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 10px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);color:var(--fg-muted);font-size:12.5px;white-space:nowrap;
}
.btn:hover{background:var(--bg-sub);color:var(--fg);border-color:var(--border-strong)}
.btn.icon{width:30px;padding:0}
.btn svg{width:15px;height:15px}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.btn:disabled{opacity:.4;cursor:default}
#btnSave.dirty{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.name .gd svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.open-wrap{position:relative;display:inline-flex}
.menu{
  position:absolute;top:36px;right:0;z-index:40;min-width:230px;padding:5px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);
}
.menu button{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;font-size:13.5px;color:var(--fg)}
.menu button:hover{background:var(--bg-sub)}
.menu small{display:block;font-size:11px;color:var(--fg-faint);margin-top:2px}

/* ---------- 編集部品の色と文字をこの画面に合わせる（部品のテーマより後に効くよう .wrap を付ける） ---------- */
.wrap .milkdown{
  --crepe-color-background:var(--bg);
  --crepe-color-on-background:var(--fg);
  --crepe-color-surface:var(--bg-sub);
  --crepe-color-surface-low:var(--bg-sunken);
  --crepe-color-on-surface:var(--fg);
  --crepe-color-on-surface-variant:var(--fg-muted);
  --crepe-color-outline:var(--border-strong);
  --crepe-color-primary:var(--accent);
  --crepe-color-secondary:var(--accent-soft);
  --crepe-color-on-secondary:var(--fg);
  --crepe-color-inverse:var(--fg);
  --crepe-color-on-inverse:var(--bg);
  --crepe-color-inline-code:#d1405b;
  --crepe-color-hover:var(--bg-sub);
  --crepe-color-selected:var(--accent-soft);
  --crepe-color-inline-area:var(--bg-sunken);
  --crepe-font-title:var(--sans);
  --crepe-font-default:var(--sans);
  --crepe-font-code:var(--mono);
  --crepe-shadow-1:var(--shadow-sm);
  --crepe-shadow-2:var(--shadow-md);
  --crepe-base-font-size:var(--fs, 15px);
}
/* 本文の幅は設定で変えられる（--cw） */
.wrap{max-width:var(--cw, 860px);margin:0 auto;padding:16px 0 40vh}
.wrap .milkdown .ProseMirror{padding:20px 56px 60px 80px;line-height:1.8;font-size:var(--fs, 15px)}
/* 長いパスや URL で画面より広がらないように折り返す */
.wrap .milkdown .ProseMirror{overflow-wrap:anywhere}
.wrap .milkdown .ProseMirror code{overflow-wrap:anywhere;word-break:break-all}
.wrap .milkdown .ProseMirror h1,.wrap .milkdown .ProseMirror h2{border-bottom:1px solid var(--border);padding-bottom:.3em;font-weight:700;letter-spacing:.01em}
.wrap .milkdown .ProseMirror h1{font-size:1.72em;line-height:1.35;margin-top:6px}
.wrap .milkdown .ProseMirror h2{font-size:1.33em;line-height:1.4;margin-top:24px}
.wrap .milkdown .ProseMirror h3{font-size:1.13em;font-weight:700;margin-top:20px}

/* 箇条書き: 記号と文の間を詰める */
.wrap .milkdown .milkdown-list-item-block li{gap:3px}
.wrap .milkdown .milkdown-list-item-block li .label-wrapper,
.wrap .milkdown .milkdown-list-item-block li .label-wrapper .label{width:18px}

/* 表: 細かく折り返さず、表の中だけ左右にスクロールする */
.wrap .milkdown .milkdown-table-block .table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wrap .milkdown .milkdown-table-block table{width:max-content;min-width:100%}
.wrap .milkdown .milkdown-table-block th,.wrap .milkdown .milkdown-table-block td{min-width:7em;max-width:22em;overflow-wrap:normal;word-break:normal}

/* 書式のバー（iPhone）: 箇条書き・挿入などのボタンは最初から黒。
   文字の書式（太字・斜体・取り消し線・コード。見出しの選択と区切り線に続く 3〜6 番目）だけは、オフは灰色・オンで色が付く */
.wrap .milkdown .milkdown-top-bar .top-bar-item svg{color:var(--fg);fill:var(--fg)}
.wrap .milkdown .milkdown-top-bar .top-bar-inner > .top-bar-item:nth-child(-n+6):not(.active) svg{color:var(--crepe-color-outline);fill:var(--crepe-color-outline)}
.wrap .milkdown .milkdown-top-bar .top-bar-item.active svg{color:var(--crepe-color-primary);fill:var(--crepe-color-primary)}

/* 設定メニュー（文字の大きさ・テーマ） */
.cfg-wrap{position:relative;display:inline-flex}
.menu .row{padding:6px 8px 8px}
.menu .row > span{display:block;font-size:11.5px;color:var(--fg-faint);margin-bottom:5px}
.seg2{display:flex;gap:2px;background:var(--bg-sunken);padding:2px;border-radius:8px}
.menu .seg2 button{flex:1;text-align:center;padding:6px 0;border-radius:6px;font-size:12.5px;color:var(--fg-muted)}
@media (max-width:820px){ .menu .pc-only{display:none} }
.menu .ver{padding:6px 11px 4px;font-size:11px;color:var(--fg-faint);border-top:1px solid var(--border);margin-top:4px}
.menu .seg2 button.on{background:var(--bg-elev);color:var(--fg);font-weight:600;box-shadow:var(--shadow-sm)}

/* 段落をつかんだとき：標準の選択色（ずれた灰色）を消して、ブロック全体を淡く塗る */
.wrap .milkdown .ProseMirror .ProseMirror-selectednode{
  outline:none;background:var(--accent-soft);border-radius:6px;box-shadow:0 0 0 3px var(--accent-soft);
}
.wrap .milkdown .ProseMirror .ProseMirror-selectednode::after{display:none}
.wrap .milkdown .ProseMirror-hideselection,
.wrap .milkdown .ProseMirror-hideselection *{caret-color:transparent}
.wrap .milkdown .ProseMirror-hideselection *::selection{background:transparent}
.wrap .milkdown .ProseMirror-hideselection *::-moz-selection{background:transparent}

/* 閲覧中：書式のバーと ⋮⋮ を隠す */
body.readonly .milkdown .milkdown-top-bar,
body.readonly .milkdown .milkdown-block-handle{display:none !important}
.foot{max-width:var(--cw, 860px);margin:0 auto;padding:0 80px 40px;font-size:12px;color:var(--fg-faint)}

/* ---------- PC の編集パネル ---------- */
#btnPanel{display:none}
body.can-panel #btnPanel{display:inline-flex}
.panel{
  position:fixed;left:0;top:46px;bottom:0;width:240px;z-index:25;overflow-y:auto;
  background:var(--bg-sub);border-right:1px solid var(--border);font-size:13px;
}
body:not(.has-panel) .panel{display:none}
body.has-panel .wrap,body.has-panel .foot{
  margin-left:max(256px, calc((100% - var(--cw, 860px)) / 2 + 120px));
  max-width:min(var(--cw, 860px), calc(100% - 272px));
}
.p-sec{padding:12px 12px 14px}
.p-sec + .p-sec{border-top:1px solid var(--border)}
.p-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--fg-faint);margin-bottom:8px}
.p-head span{font-weight:400;letter-spacing:0}
.p-label{font-size:11px;color:var(--fg-faint);margin:10px 0 5px}
.p-row2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.p-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.p-grid + .p-grid{margin-top:5px}
.p-grid.g5{grid-template-columns:repeat(5,1fr);gap:4px}
.p-grid.g5 .kb small{font-size:8.5px;white-space:nowrap;letter-spacing:-.04em}
.kb{
  height:40px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:14px;line-height:1.1;color:var(--fg);
}
.kb small{font-size:9.5px;color:var(--fg-faint)}
.kb:hover{border-color:var(--border-strong)}
.kb.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.kb.on small{color:var(--accent)}
.kb.wide{flex-direction:row;gap:6px;height:32px;font-size:12.5px;color:var(--fg-muted)}
.kb.wide svg{width:15px;height:15px}
.seg{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:2px;background:var(--bg-sunken);padding:2px;border-radius:8px}
.seg button{padding:6px 0;border-radius:6px;font-size:12px;color:var(--fg-muted)}
.seg button.on{background:var(--bg-elev);color:var(--fg);font-weight:600;box-shadow:var(--shadow-sm)}
#toc a{display:block;padding:4px 8px;border-radius:6px;color:var(--fg-muted);text-decoration:none;line-height:1.45;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc a:hover{background:var(--bg-sunken);color:var(--fg)}
#toc a.l2{padding-left:18px}
#toc a.l3{padding-left:30px;font-size:12px}
#toc .none{color:var(--fg-faint);font-size:12px;padding:2px 8px}
.p-foot{font-size:11.5px;color:var(--fg-faint)}
body.readonly .panel .edit-only{display:none}

/* ---------- パスから開くときのカード ---------- */
.pathcard{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:16px;background:rgba(15,18,22,.35)}
.pathcard[hidden]{display:none}
.pc-box{width:min(420px,100%);background:var(--bg-elev);border-radius:14px;box-shadow:var(--shadow-md);padding:18px 18px 14px}
.pc-body b{display:block;font-size:16px;margin-bottom:2px;overflow-wrap:anywhere}
.pc-body small{display:block;font-size:11.5px;color:var(--fg-faint);overflow-wrap:anywhere;margin-bottom:10px}
.pc-body p{margin:0 0 12px;font-size:13.5px;line-height:1.7;color:var(--fg-muted)}
.pc-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.pc-btns .btn{width:auto;height:36px;padding:0 14px;font-size:13.5px}
.pc-btns .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}

/* ---------- ドロップ・お知らせ ---------- */
.dropzone{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:color-mix(in srgb, var(--bg) 80%, transparent);border:3px dashed var(--accent)}
.dropzone.on{display:grid}
.dropzone p{font-size:18px;font-weight:700;color:var(--accent)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:70;
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- スマホ ---------- */
@media (max-width:820px){
  .top{gap:4px;padding:0 8px;height:44px}
  .brand .label,.btn .label,.sep{display:none}
  .btn{width:32px;height:30px;padding:0}
  .wrap{padding-top:4px}
  .wrap .milkdown .ProseMirror{padding:12px 16px 60px 46px;line-height:1.75}
  .wrap .milkdown .ProseMirror h1{font-size:1.47em}
  .wrap .milkdown .ProseMirror h2{font-size:1.2em;margin-top:20px}
  .wrap .milkdown .ProseMirror h3{font-size:1.07em}
  /* ⋮⋮ だけにして（「＋」は「/」で代わりになる）、左の余白に収める */
  .wrap .milkdown .milkdown-block-handle .operation-item:first-child{display:none}
  .wrap .milkdown .milkdown-block-handle .operation-item{width:26px;height:28px;padding:2px 1px}
  .wrap .milkdown .milkdown-block-handle .operation-item svg{width:22px;height:22px}
  .foot{padding:0 16px 40px}
  .toast{bottom:auto;top:54px;transform:translate(-50%,-10px)}
  /* 書式のバー（TopBar）は、上のバーのすぐ下に貼りつける */
  .wrap .milkdown .milkdown-top-bar{position:sticky;top:44px;z-index:20;min-height:0;transform:translateY(var(--vv, 0px))}
  .wrap .milkdown .milkdown-top-bar{padding:1px 4px}
  .wrap .milkdown .milkdown-top-bar .top-bar-item{margin:1px;width:30px;height:30px;padding:3px}
  .wrap .milkdown .milkdown-top-bar .top-bar-item svg{width:22px;height:22px}
  .wrap .milkdown .milkdown-top-bar .top-bar-heading-button{height:28px}
  .wrap .milkdown .milkdown-top-bar .top-bar-divider{margin:4px 3px}
  .wrap .milkdown .milkdown-top-bar .top-bar-heading-selector{padding:1px}
}
</style>
<style>/*__CSS__*/</style>
</head>
<body>
<header class="top">
  <button class="btn icon" id="btnPanel" title="編集パネルを開閉" aria-label="編集パネルを開閉" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6 15V9l3 3 3-3v6"/><path d="M16 9v4m0 0 2-2m-2 2-2-2"/></svg>
    <span class="label">Markdown Viewer</span>
  </div>
  <div class="name" id="docName"></div>
  <button class="btn icon" id="btnUndo" title="元に戻す (Ctrl+Z)" aria-label="元に戻す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="btn icon" id="btnRedo" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <span class="sep"></span>
  <button class="btn" id="btnView" title="閲覧に切り替え（書き換えを止める）" aria-label="閲覧に切り替え" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="label">閲覧に切り替え</span></button>
  <button class="btn" id="btnSave" title="保存 (Ctrl+S)" aria-label="保存">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></svg>
    <span class="label">保存</span>
  </button>
  <span class="open-wrap">
  <button class="btn" id="btnOpen" title="ファイルを開く (Ctrl+O)" aria-label="開く">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span class="label">開く</span>
  </button>
  <div class="menu" id="openMenu" hidden>
    <button id="openLocal">この端末から開く</button>
    <button id="openDrive">Googleドライブから開く<small>保存すると、ドライブのファイルに上書きします</small></button>
  </div>
  </span>
  <button class="btn" id="btnNew" title="空のファイルを作る" aria-label="ファイルを作成">＋<span class="label">ファイルを作成</span></button>
  <span class="cfg-wrap">
  <button class="btn icon" id="btnCfg" title="表示の設定" aria-label="表示の設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg></button>
  <div class="menu" id="cfgMenu" hidden>
    <div class="row"><span>文字の大きさ</span>
      <div class="seg2" id="segFs"><button data-v="13.5">小</button><button data-v="15">標準</button><button data-v="17">大</button><button data-v="19">特大</button></div>
    </div>
    <div class="row pc-only"><span>本文の幅</span>
      <div class="seg2" id="segCw"><button data-v="700">狭い</button><button data-v="860">標準</button><button data-v="1100">広い</button><button data-v="9999">最大</button></div>
    </div>
    <div class="row"><span>テーマ</span>
