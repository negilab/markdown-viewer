<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Viewer — ドラッグ&amp;ドロップで読むMarkdown</title>
<meta name="description" content="Markdownファイルをドラッグ&amp;ドロップするだけ。インデントと表を人が読みやすい形で表示する、単一HTMLのビューアです。">
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  color-scheme: light;
  --bg:            #ffffff;
  --bg-sub:        #f7f8fa;
  --bg-sunken:     #eef0f4;
  --bg-elev:       #ffffff;
  --fg:            #1f2328;
  --fg-muted:      #61697a;
  --fg-faint:      #8b93a3;
  --border:        #dfe3e9;
  --border-strong: #c6ccd6;
  --accent:        #2f6feb;
  --accent-soft:   #e8effd;
  --accent-fg:     #ffffff;
  --mark:          #fff3b8;
  --quote-bar:     #cfd6e0;
  --code-bg:       #f4f6f9;
  --code-fg:       #24292f;
  --code-block-bg: #f7f8fa;
  --table-head-bg: #f2f4f8;
  --table-zebra:   #fafbfc;
  --table-hover:   #eef4ff;
  --guide:         #e3e7ee;
  --shadow-sm: 0 1px 2px rgba(16,22,34,.06), 0 1px 3px rgba(16,22,34,.05);
  --shadow-md: 0 6px 20px rgba(16,22,34,.10), 0 2px 6px rgba(16,22,34,.06);
  --radius: 10px;
  --sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans",
          "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular",
          "BIZ UDGothic", Menlo, monospace;
  --content-w: 820px;
  --fs: 16px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:            #0f1216;
  --bg-sub:        #14181e;
  --bg-sunken:     #0b0e12;
  --bg-elev:       #171c23;
  --fg:            #dfe3ea;
  --fg-muted:      #9aa4b4;
  --fg-faint:      #6d7787;
  --border:        #262d37;
  --border-strong: #38414e;
  --accent:        #6ea1ff;
  --accent-soft:   #17233a;
  --accent-fg:     #0f1216;
  --mark:          #6a5a12;
  --quote-bar:     #39424f;
  --code-bg:       #1b2129;
  --code-fg:       #d6dde7;
  --code-block-bg: #14181e;
  --table-head-bg: #1a2027;
  --table-zebra:   #13171d;
  --table-hover:   #1c2634;
  --guide:         #262d37;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 8px 24px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    color-scheme: dark;
    --bg:#0f1216; --bg-sub:#14181e; --bg-sunken:#0b0e12; --bg-elev:#171c23;
    --fg:#dfe3ea; --fg-muted:#9aa4b4; --fg-faint:#6d7787;
    --border:#262d37; --border-strong:#38414e;
    --accent:#6ea1ff; --accent-soft:#17233a; --accent-fg:#0f1216;
    --mark:#6a5a12; --quote-bar:#39424f;
    --code-bg:#1b2129; --code-fg:#d6dde7; --code-block-bg:#14181e;
    --table-head-bg:#1a2027; --table-zebra:#13171d; --table-hover:#1c2634;
    --guide:#262d37;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45);
  }
}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:var(--fs); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ============================================================
   App shell
   ============================================================ */
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}

.topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 14px;height:52px;
  background:var(--bg-elev);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:22px;height:22px;color:var(--accent)}
.doc-title{
  min-width:0;flex:1;font-size:13px;color:var(--fg-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px;
}
.doc-title b{color:var(--fg);font-weight:600}
.tools{display:flex;align-items:center;gap:6px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 11px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);
  font-size:13px;font-weight:500;color:var(--fg-muted);
  transition:background .12s, color .12s, border-color .12s;
  white-space:nowrap;
}
.btn:hover{background:var(--bg-sub);color:var(--fg);border-color:var(--border-strong)}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px}

.body{display:grid;grid-template-columns:264px 1fr;min-height:0}
.body.no-side{grid-template-columns:0 1fr}
.body.no-side .sidebar{display:none}

/* ---------- sidebar ---------- */
.sidebar{
  background:var(--bg-sub);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.side-sec{display:flex;flex-direction:column;min-height:0}
.side-sec + .side-sec{border-top:1px solid var(--border)}
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 14px 7px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);
}
.side-head button{font-size:11px;color:var(--fg-faint)}
.side-head button:hover{color:var(--accent)}
.side-body{overflow-y:auto;padding:0 8px 12px}
.files{flex:0 0 auto;max-height:34%}
.toc-sec{flex:1 1 auto}

.file-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 9px;border-radius:7px;font-size:13px;text-align:left;
  color:var(--fg-muted);
}
.file-item:hover{background:var(--bg-sunken);color:var(--fg)}
.file-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.file-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .x{opacity:0;color:var(--fg-faint);padding:2px 5px;border-radius:4px;line-height:1}
.file-item:hover .x{opacity:1}
.file-item .x:hover{background:var(--bg);color:#e5534b}

#toc a{
  display:block;padding:5px 10px;border-radius:6px;
  font-size:13px;line-height:1.4;color:var(--fg-muted);text-decoration:none;
  border-left:2px solid transparent;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#toc a:hover{background:var(--bg-sunken);color:var(--fg)}
#toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
#toc a.lv3{padding-left:24px;font-size:12.5px}
#toc a.lv4,#toc a.lv5,#toc a.lv6{padding-left:38px;font-size:12px;color:var(--fg-faint)}
.side-empty{padding:6px 10px;font-size:12px;color:var(--fg-faint);line-height:1.7}

/* ---------- main ---------- */
.main{position:relative;overflow-y:auto;background:var(--bg)}
.reader{max-width:var(--content-w);margin:0 auto;padding:44px 40px 45vh}

/* ---------- empty state ---------- */
.empty{height:100%;display:grid;place-items:center;padding:32px;text-align:center}
.empty-inner{max-width:540px}
.empty h1{font-size:26px;margin:18px 0 8px;letter-spacing:.01em}
.empty p{color:var(--fg-muted);line-height:1.9;margin:0 0 22px;font-size:14.5px}
.empty .ill{
  width:96px;height:96px;margin:0 auto;border-radius:24px;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
.empty .ill svg{width:46px;height:46px}
.empty .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.kbd{
  display:inline-block;padding:1px 6px;border-radius:5px;font-family:var(--mono);
  font-size:12px;background:var(--bg-sunken);border:1px solid var(--border);
  border-bottom-width:2px;color:var(--fg-muted);
}

/* ---------- drop overlay ---------- */
.dropzone{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;
  background:rgba(20,26,36,.55);
}
.dropzone.on{display:grid}
.dropzone .box{
  padding:52px 68px;border-radius:20px;border:3px dashed var(--accent);
  background:var(--bg-elev);box-shadow:var(--shadow-md);text-align:center;
  animation:pop .18s ease-out;
}
.dropzone .box svg{width:52px;height:52px;color:var(--accent)}
.dropzone .box p{margin:10px 0 2px;font-weight:700;font-size:17px}
.dropzone .box span{color:var(--fg-muted);font-size:13px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;z-index:70;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- settings popover ---------- */
.pop{
  position:absolute;top:46px;right:12px;z-index:50;width:270px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-md);padding:8px;display:none;
}
.pop.on{display:block}
.pop h4{margin:8px 8px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-faint)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px;border-radius:8px;font-size:13.5px}
.row:hover{background:var(--bg-sub)}
.seg{display:flex;gap:2px;background:var(--bg-sunken);padding:2px;border-radius:8px}
.seg button{padding:4px 9px;border-radius:6px;font-size:12px;color:var(--fg-muted)}
.seg button.on{background:var(--bg-elev);color:var(--fg);font-weight:600;box-shadow:var(--shadow-sm)}
.switch{width:38px;height:22px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(16px)}

/* ============================================================
   Markdown typography  —  the part that has to look good
   ============================================================ */
.md{line-height:1.85;word-wrap:break-word;overflow-wrap:anywhere}
.md > *:first-child{margin-top:0}

.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{
  line-height:1.4;font-weight:700;letter-spacing:.005em;
  margin:2em 0 .7em;scroll-margin-top:70px;position:relative;
}
.md h1{font-size:1.85em;margin-top:0;padding-bottom:.35em;border-bottom:1px solid var(--border)}
.md h2{font-size:1.42em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h3{font-size:1.2em}
.md h4{font-size:1.05em}
.md h5{font-size:.95em;color:var(--fg-muted)}
.md h6{font-size:.88em;color:var(--fg-faint)}
.md h1 .anchor,.md h2 .anchor,.md h3 .anchor,.md h4 .anchor,.md h5 .anchor,.md h6 .anchor{
  position:absolute;left:-.85em;width:.85em;opacity:0;
  color:var(--fg-faint);text-decoration:none;font-weight:400;
}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,
.md h4:hover .anchor,.md h5:hover .anchor,.md h6:hover .anchor{opacity:1}

.md p{margin:0 0 1.15em}
.md a{text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent)}
.md a:hover{border-bottom-color:var(--accent);background:var(--accent-soft)}
.md strong{font-weight:700}
.md em{font-style:italic}
.md del{color:var(--fg-faint)}
.md mark{background:var(--mark);color:inherit;padding:.05em .2em;border-radius:3px}
.md hr{height:1px;border:0;background:var(--border);margin:2.4em 0}
.md img{max-width:100%;border-radius:8px;box-shadow:var(--shadow-sm)}
.md kbd{
  font-family:var(--mono);font-size:.82em;padding:.15em .45em;border-radius:5px;
  background:var(--bg-sunken);border:1px solid var(--border);border-bottom-width:2px;
}

/* ---------- lists: readable indentation is the point ---------- */
.md ul,.md ol{margin:0 0 1.15em;padding-left:1.75em}
.md li{margin:.32em 0}
.md li::marker{color:var(--fg-faint)}
.md ol{list-style:decimal}
.md ol ol{list-style:lower-alpha}
.md ol ol ol{list-style:lower-roman}
.md ul{list-style:disc}
.md ul ul{list-style:circle}
.md ul ul ul{list-style:square}
/* nested levels get a soft vertical guide so depth is obvious */
.md li > ul,.md li > ol{
  margin:.32em 0 .32em;padding-left:1.5em;
  border-left:1px solid var(--guide);margin-left:.15em;
}
.md li > p{margin:.35em 0 .6em}
.md li > p:last-child{margin-bottom:.2em}
.md .task{list-style:none;margin-left:-1.55em;padding-left:1.55em;position:relative}
.md .task input{
  position:absolute;left:0;top:.42em;width:15px;height:15px;
  accent-color:var(--accent);margin:0;
}
.md .task.done{color:var(--fg-faint)}
.md .task.done > span.tt{text-decoration:line-through}

/* ---------- blockquote ---------- */
.md blockquote{
  margin:0 0 1.2em;padding:.15em 0 .15em 1.15em;
  border-left:4px solid var(--quote-bar);color:var(--fg-muted);
}
.md blockquote > *:last-child{margin-bottom:0}
.md blockquote blockquote{margin-top:.6em}

/* ---------- code ---------- */
.md code{
  font-family:var(--mono);font-size:.875em;
  background:var(--code-bg);color:var(--code-fg);
  padding:.15em .38em;border-radius:5px;
  border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
}
.md pre{
  margin:0 0 1.3em;border:1px solid var(--border);border-radius:var(--radius, 10px);
  background:var(--code-block-bg);overflow:hidden;position:relative;
}
.md pre code{
  display:block;padding:14px 16px;overflow-x:auto;
  background:none;border:0;border-radius:0;font-size:.855em;
  line-height:1.7;tab-size:4;white-space:pre;
  color:var(--code-fg);
}
.md pre .lang{
  position:absolute;top:0;right:0;padding:3px 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  color:var(--fg-faint);background:var(--bg-sunken);
  border-left:1px solid var(--border);border-bottom:1px solid var(--border);
  border-bottom-left-radius:8px;
}
.md pre .copy{
  position:absolute;top:6px;right:8px;padding:4px 9px;border-radius:6px;
  font-size:11.5px;color:var(--fg-muted);background:var(--bg-elev);
  border:1px solid var(--border);opacity:0;transition:opacity .12s;
}
.md pre:hover .copy{opacity:1}
.md pre:hover .lang{opacity:0}
.md pre .copy:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- tables: the other part that has to look good ---------- */
.table-wrap{
  margin:0 0 1.4em;overflow-x:auto;border:1px solid var(--border);
  border-radius:var(--radius, 10px);box-shadow:var(--shadow-sm);
  background:var(--bg-elev);
}
.md table{border-collapse:separate;border-spacing:0;width:100%;font-size:.93em;line-height:1.6}
.md thead th{
  position:sticky;top:0;z-index:1;
  background:var(--table-head-bg);font-weight:700;white-space:nowrap;
  border-bottom:1px solid var(--border-strong);
}
.md th,.md td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.md th + th,.md td + td{border-left:1px solid var(--border)}
.md tbody tr:nth-child(even){background:var(--table-zebra)}
.md tbody tr:hover{background:var(--table-hover)}
.md tbody tr:last-child td{border-bottom:0}
.md td.num,.md th.num{font-variant-numeric:tabular-nums}
.md .ta-c{text-align:center}
.md .ta-r{text-align:right}
.md table code{white-space:nowrap}

/* ---------- front matter card ---------- */
.fm{
  margin:0 0 1.8em;border:1px solid var(--border);border-radius:var(--radius, 10px);
  background:var(--bg-sub);padding:4px 2px;font-size:.86em;
}
.fm dl{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;margin:0;padding:8px 14px}
.fm dt{color:var(--fg-faint);font-weight:600;white-space:nowrap}
.fm dd{margin:0;color:var(--fg-muted);overflow-wrap:anywhere}

/* ---------- footnotes ---------- */
.md .fnref{font-size:.78em;vertical-align:super;line-height:0;padding:0 .1em}
.md .footnotes{margin-top:2.6em;padding-top:1.1em;border-top:1px solid var(--border);font-size:.9em;color:var(--fg-muted)}
.md .footnotes ol{padding-left:1.4em}

/* ---------- doc meta footer ---------- */
.docmeta{
  margin-top:3em;padding-top:14px;border-top:1px dashed var(--border);
  display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg-faint);
}

/* ---------- reading width / font size modifiers ---------- */
.w-narrow{--content-w:680px}
.w-normal{--content-w:820px}
.w-wide{--content-w:1080px}

/* ---------- print ---------- */
@media print{
  body{overflow:visible}
  .topbar,.sidebar,.dropzone,.toast,.pop,.md pre .copy{display:none !important}
  .app{display:block;height:auto}
  .body{display:block}
  .main{overflow:visible}
  .reader{max-width:none;padding:0}
  .md pre,.table-wrap{break-inside:avoid}
  .md h1,.md h2,.md h3{break-after:avoid}
  .md thead th{position:static}
}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .body{grid-template-columns:0 1fr}
  .sidebar{
    position:fixed;left:0;top:52px;bottom:0;width:264px;z-index:30;
    transform:translateX(-100%);transition:transform .18s ease;
  }
  .body:not(.no-side) .sidebar{display:flex;transform:none;box-shadow:var(--shadow-md)}
  .reader{padding:28px 20px 40vh}
  .doc-title{display:none}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <button class="btn icon" id="btnSide" title="サイドバー (Ctrl+B)" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
    </button>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6 15V9l3 3 3-3v6"/><path d="M16 9v4m0 0 2-2m-2 2-2-2"/>
      </svg>
      Markdown Viewer
    </div>
    <div class="doc-title" id="docTitle"></div>
    <div class="tools">
      <button class="btn" id="btnOpen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        ファイルを開く
      </button>
      <button class="btn icon" id="btnPrint" title="印刷 / PDF保存 (Ctrl+P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 15h12v6H6z"/></svg>
      </button>
      <button class="btn icon" id="btnTheme" title="テーマ切り替え">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <button class="btn icon" id="btnCfg" title="表示設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg>
      </button>

    <div class="pop" id="pop">
      <h4>文字サイズ</h4>

        <div class="seg" id="segSize">
          <button data-v="15">小</button><button data-v="16" class="on">標準</button><button data-v="17.5">大</button><button data-v="19">特大</button>
        </div>
      </div>
      <h4>読みやすさ</h4>
      <div class="row">本文の幅
        <div class="seg" id="segWidth">

        </div>

        <button class="switch" id="swBreaks" aria-pressed="false" title="単一の改行を <br> として表示"></button>
      </div>

        <button class="switch" id="swNum" aria-pressed="true" title="数値だけの列を自動で右寄せ"></button>

        <div class="side-body" id="fileList"><div class="side-empty">まだ開いていません</div></div>
      </section>
      <section class="side-sec toc-sec">
        <div class="side-head"><span>目次</span></div>
        <div class="side-body" id="toc"><div class="side-empty">見出しがここに並びます</div></div>
      </section>
    </aside>

    <main class="main" id="main">
      <div class="empty" id="empty">
        <div class="empty-inner">
          <div class="ill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/>
            </svg>
          </div>
          <h1>Markdownファイルをドロップ</h1>
          <p>
            この画面のどこにでも <code>.md</code> ファイルをドラッグ&amp;ドロップしてください。<br>
            ネストしたリストのインデントと表を、読みやすい形に整えて表示します。<br>
            <span class="kbd">Ctrl</span>+<span class="kbd">V</span> でクリップボードのMarkdownも読み込めます。
          </p>
          <div class="cta">
            <button class="btn primary" id="btnOpen2">ファイルを選ぶ</button>
            <button class="btn" id="btnDemo">サンプルを見る</button>

        <div class="docmeta" id="docMeta"></div>

<div class="dropzone" id="dropzone">
  <div class="box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <p>ここにドロップ</p>
    <span>.md / .markdown / .mdx / .txt に対応</span>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="picker" accept=".md,.markdown,.mdx,.mkd,.txt,text/markdown,text/plain" multiple hidden>

<script>
/* ============================================================================
 *  markdown.js  —  自作Markdownパーサ（外部ライブラリなし）
 *  ブロック解析 → インライン解析 の 2 パス構成。
 * ==========================================================================*/
const MD = (() => {
  "use strict";

  const NUL = String.fromCharCode(0);   /* 本文に出ない制御文字をプレースホルダに使う */
  const esc = s => s.replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* 安全側に倒したインラインHTMLの許可リスト */
  const INLINE_TAGS = /^(br|wbr|sub|sup|kbd|mark|u|ins|del|small|b|i|em|strong|code|abbr|span)$/i;
  /* 生HTMLブロックとして通す可能性のあるタグ */
  const BLOCK_TAGS  = /^(div|p|details|summary|table|thead|tbody|tr|td|th|section|article|aside|figure|figcaption|picture|img|video|audio|source|center|blockquote|ul|ol|li|h[1-6]|dl|dt|dd|pre|hr|a|span|b|strong|em|i|code|br)$/i;

  /* ---------------------------------------------------------------- inline */
  function inline(src, ctx) {
    const slots = [];
    const put = html => { slots.push(html); return NUL + (slots.length - 1) + NUL; };
    let s = src;

    /* 1. バックスラッシュエスケープを退避 */
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!>~|=])/g, (_, c) => put(esc(c)));

    /* 2. コードスパン（内部は一切解釈しない） */
    s = s.replace(/(`+)([^`]|[\s\S]*?[^`])\1(?!`)/g, (m, fence, code) =>
      put("<code>" + esc(code.replace(/^ (.*) $/s, "$1")) + "</code>"));

    /* 3. 残りをエスケープしてから、許可タグだけ復活 */
    s = esc(s);
    s = s.replace(/&lt;(\/?)([a-zA-Z][a-zA-Z0-9]*)\s*(\/?)&gt;/g,
      (m, close, tag, self) => INLINE_TAGS.test(tag) ? "<" + close + tag.toLowerCase() + self + ">" : m);

    /* 4. 脚注参照 */
    s = s.replace(/\[\^([^\]\s]+)\]/g, (m, id) => {
      if (!ctx.footnotes[id]) return m;
      const n = ctx.footnoteOrder.indexOf(id) >= 0
        ? ctx.footnoteOrder.indexOf(id) + 1
        : ctx.footnoteOrder.push(id);
      return put('<sup class="fnref" id="fnref-' + esc(id) + '"><a href="#fn-' + esc(id) + '">' + n + "</a></sup>");
    });

    /* 5. 画像 → リンク（先に画像を処理する） */
    const url = u => {
      const t = u.trim().replace(/^&lt;|&gt;$/g, "");
      return /^\s*(javascript|vbscript|data:text\/html)/i.test(t.replace(/\s/g, "")) ? "#" : t;
    };
    s = s.replace(/!\[([^\]]*)\]\(\s*([^()\s]+(?:\([^)]*\)[^()\s]*)*)(?:\s+(?:&quot;|')(.*?)(?:&quot;|'))?\s*\)/g,
      (m, alt, href, title) =>
        put('<img src="' + url(href) + '" alt="' + alt + '"' + (title ? ' title="' + title + '"' : "") + ">"));

    /* 参照形式の画像 / リンク */
    s = s.replace(/!\[([^\]]*)\]\[([^\]]*)\]/g, (m, alt, id) => {
      const d = ctx.refs[(id || alt).toLowerCase()];
      return d ? put('<img src="' + url(d.href) + '" alt="' + alt + '">') : m;
    });

    s = s.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\(\s*([^()\s]*(?:\([^)]*\)[^()\s]*)*)(?:\s+(?:&quot;|')(.*?)(?:&quot;|'))?\s*\)/g,
      (m, text, href, title) =>
        put('<a href="' + url(href) + '"' + (title ? ' title="' + title + '"' : "") +
            (/^(https?:)?\/\//.test(href.trim()) ? ' target="_blank" rel="noopener noreferrer"' : "") +
            ">") + text + put("</a>"));

    s = s.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\[([^\]]*)\]/g, (m, text, id) => {
      const d = ctx.refs[(id || text).toLowerCase()];
      return d ? put('<a href="' + url(d.href) + '">') + text + put("</a>") : m;
    });

    /* 6. 自動リンク */
    s = s.replace(/&lt;((?:https?|ftp):\/\/[^\s&]+)&gt;/g,
      (m, u) => put('<a href="' + url(u) + '" target="_blank" rel="noopener noreferrer">' + u + "</a>"));
    s = s.replace(/&lt;([\w.+-]+@[\w-]+\.[\w.-]+)&gt;/g,
      (m, a) => put('<a href="mailto:' + a + '">' + a + "</a>"));
    s = s.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<>"')\]]+[^\s<>"')\].,;:!?])/g,
      (m, pre, u) => pre + put('<a href="' + url(/^www\./.test(u) ? "https://" + u : u) +
        '" target="_blank" rel="noopener noreferrer">' + u + "</a>"));

    /* 7. 強調系 */
    s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
    s = s.replace(/==(?=\S)([\s\S]*?\S)==/g, "<mark>$1</mark>");
    s = s.replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*(?=\S)([\s\S]*?\S|\S)\*/g, "<em>$1</em>");
    s = s.replace(/(^|[^\w぀-ヿ一-鿿])___(?=\S)([\s\S]*?\S)___(?![\w])/g, "$1<strong><em>$2</em></strong>");
    s = s.replace(/(^|[^\w぀-ヿ一-鿿])__(?=\S)([\s\S]*?\S)__(?![\w])/g, "$1<strong>$2</strong>");
    s = s.replace(/(^|[^\w぀-ヿ一-鿿])_(?=\S)([\s\S]*?\S|\S)_(?![\w])/g, "$1<em>$2</em>");

    /* 8. 改行 */
    s = s.replace(/(?: {2,}|\\)\n/g, "<br>\n");
    if (ctx.breaks) s = s.replace(/\n(?!$)/g, "<br>\n");

    /* 9. 退避したものを戻す */
    return s.replace(new RegExp(NUL + "(\\d+)" + NUL, "g"), (m, i) => slots[+i]);
  }

  /* ------------------------------------------------------------- utilities */
  const indentOf = l => (l.match(/^[ \t]*/)[0].replace(/\t/g, "    ")).length;
  const ITEM = /^([ \t]*)([-*+]|\d{1,9}[.)])([ \t]+|$)([\s\S]*)$/;
  const FENCE = /^([ \t]{0,3})(`{3,}|~{3,})[ \t]*([^`]*)$/;
  const isBlank = l => !l.trim();

  function slug(text, used) {
    let base = text.toLowerCase()
      .replace(/<[^>]+>/g, "")
      .replace(/[&<>"']/g, "")
      .replace(/[\s　]+/g, "-")
      .replace(/[^\w぀-ヿ一-鿿\-]/g, "")
      .replace(/^-+|-+$/g, "") || "section";
    let id = base, n = 1;
    while (used.has(id)) id = base + "-" + (++n);
    used.add(id);
    return id;
  }

  /* --------------------------------------------------------------- tables */
  function splitRow(row) {
    const cells = [];
    let cur = "", q = false;
    const t = row.trim().replace(/^\|/, "").replace(/\|$/, "");
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (c === "\\" && t[i + 1] === "|") { cur += "\\|"; i++; continue; }
      if (c === "`") q = !q;
      if (c === "|" && !q) { cells.push(cur); cur = ""; continue; }
      cur += c;
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  }
  const isDivider = l =>
    /^[ \t]{0,3}\|?[ \t]*:?-{1,}:?[ \t]*(\|[ \t]*:?-{1,}:?[ \t]*)*\|?[ \t]*$/.test(l) && /-/.test(l);

  function table(lines, i, ctx) {
    const head = lines[i], div = lines[i + 1];
    if (!head || !div || !/\|/.test(head) || !isDivider(div)) return null;
    const heads = splitRow(head), aligns = splitRow(div).map(a =>
      /^:-+:$/.test(a) ? "ta-c" : /-+:$/.test(a) ? "ta-r" : /^:-+/.test(a) ? "" : null);
    if (heads.length !== aligns.length) return null;

    const rows = [];
    let j = i + 2;
    for (; j < lines.length; j++) {
      const l = lines[j];
      if (isBlank(l) || !/\|/.test(l) || /^[ \t]{0,3}(#{1,6}\s|>|```)/.test(l)) break;
      rows.push(splitRow(l));
    }

    /* 数値だけの列は右寄せ（明示指定がない場合のみ） */
    const numish = c => /^[\s]*[+-]?[¥$€£]?[\d,]+(\.\d+)?\s*[%件個人円台本回%]?\s*$/.test(c) && /\d/.test(c);
    const cls = heads.map((_, c) => {
      if (aligns[c]) return aligns[c];
      if (!ctx.numAlign) return "";
      const col = rows.map(r => r[c]).filter(v => v != null && v !== "" && v !== "-");
      return col.length && col.every(numish) ? "ta-r num" : "";
    });

    let html = '<div class="table-wrap"><table><thead><tr>';
    heads.forEach((h, c) => {
      html += '<th' + (cls[c] ? ' class="' + cls[c] + '"' : "") + ">" + inline(h, ctx) + "</th>";
    });
    html += "</tr></thead><tbody>";
    rows.forEach(r => {
      html += "<tr>";
      for (let c = 0; c < heads.length; c++) {
        html += "<td" + (cls[c] ? ' class="' + cls[c] + '"' : "") + ">" +
          inline((r[c] || "").replace(/\\\|/g, "|"), ctx) + "</td>";
      }
      html += "</tr>";
    });
    return { html: html + "</tbody></table></div>", next: j };
  }

  /* ---------------------------------------------------------------- lists */
  function list(lines, i, ctx) {
    const base = indentOf(lines[i]);
    const first = ITEM.exec(lines[i]);
    const ordered = /\d/.test(first[2]);
    const start = ordered ? parseInt(first[2], 10) : 1;

    /* このリストに属する行を集める */
    const block = [];
    let j = i;
    while (j < lines.length) {
      const l = lines[j];
      if (isBlank(l)) {
        let k = j + 1;
        while (k < lines.length && isBlank(lines[k])) k++;
        if (k >= lines.length) break;
        const nx = lines[k];
        if (indentOf(nx) > base || (ITEM.test(nx) && indentOf(nx) >= base)) {
          for (; j < k; j++) block.push("");
          continue;
        }
        break;
      }
      const m = ITEM.exec(l);
      if (m) {
        const ind = indentOf(l);
        if (ind < base) break;
        if (ind === base && ordered !== /\d/.test(m[2])) break;   /* 種類が変わったら別リスト */
        block.push(l); j++; continue;
      }
      if (indentOf(l) > base) { block.push(l); j++; continue; }
      if (block.length && !isBlank(block[block.length - 1]) &&
          !/^[ \t]{0,3}(#{1,6}\s|>|```|~~~|\||[-*_][ \t]*[-*_])/.test(l)) {
        block.push(l); j++; continue;   /* 遅延継続行 */
      }
      break;
    }
    while (block.length && isBlank(block[block.length - 1])) block.pop();

    /* 項目に分割 */
    const items = [];
    let cur = null, contentIndent = 0;
    block.forEach(l => {
      const m = ITEM.exec(l);
      const ind = indentOf(l);
      if (m && ind <= base + 1 || (m && cur && ind < contentIndent)) {
        contentIndent = ind + m[2].length + (m[3] || " ").replace(/\t/g, "    ").length;
        cur = { lines: [m[4] || ""], indent: contentIndent };
        items.push(cur);
      } else if (cur) {
        cur.lines.push(l.replace(/\t/g, "    ").slice(Math.min(cur.indent, indentOf(l))));
      }
    });

    const loose = /\n[ \t]*\n/.test(block.join("\n").trim());
    let html = ordered
      ? "<ol" + (start !== 1 ? ' start="' + start + '"' : "") + ">"
      : "<ul>";

    items.forEach(it => {
      let body = it.lines.join("\n");
      let cls = "", box = "";
      const task = /^\[([ xX])\][ \t]+([\s\S]*)$/.exec(body);
      if (task) {
        const done = task[1].toLowerCase() === "x";
        cls = ' class="task' + (done ? " done" : "") + '"';
        box = '<input type="checkbox" disabled' + (done ? " checked" : "") + ">";
        body = task[2];
      }
      let inner = parse(body, ctx);
      if (!loose) inner = inner.replace(/^<p>([\s\S]*?)<\/p>\s*/, "$1");
      if (task) inner = inner.replace(/^([\s\S]*?)(?=<ul|<ol|<p|$)/, '<span class="tt">$1</span>');
      html += "<li" + cls + ">" + box + inner + "</li>";
    });

    return { html: html + (ordered ? "</ol>" : "</ul>"), next: i + block.length };
  }

  /* --------------------------------------------------------------- blocks */
  function parse(src, ctx) {
    const lines = src.replace(/\t/g, "    ").split("\n");
    let out = "", i = 0;

    while (i < lines.length) {
      const line = lines[i];
      if (isBlank(line)) { i++; continue; }

      /* コードフェンス */
      let m = FENCE.exec(line);
      if (m) {
        const fence = m[2][0], len = m[2].length, lang = (m[3] || "").trim().split(/\s+/)[0];
        const buf = []; i++;
        while (i < lines.length) {
          const l = lines[i];
          if (new RegExp("^[ \\t]{0,3}" + fence + "{" + len + ",}[ \\t]*$").test(l)) { i++; break; }
          buf.push(l.replace(new RegExp("^[ ]{0," + indentOf(line) + "}"), ""));
          i++;
        }
        out += '<pre data-lang="' + esc(lang) + '">' +
               (lang ? '<span class="lang">' + esc(lang) + "</span>" : "") +
               '<button class="copy" type="button">コピー</button>' +
               "<code>" + esc(buf.join("\n")) + "</code></pre>";
        continue;
      }

      /* 水平線 */
      if (/^[ \t]{0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}$/.test(line)) { out += "<hr>"; i++; continue; }

      /* ATX 見出し */
      m = /^[ \t]{0,3}(#{1,6})[ \t]+(.*?)[ \t]*#*[ \t]*$/.exec(line);
      if (m) {
        const lv = m[1].length, text = inline(m[2], ctx);
        const id = slug(m[2], ctx.ids);
        ctx.toc.push({ id, lv, text });
        out += "<h" + lv + ' id="' + id + '"><a class="anchor" href="#' + id + '" aria-hidden="true">#</a>' +
               text + "</h" + lv + ">";
        i++; continue;
      }

      /* 引用 */
      if (/^[ \t]{0,3}>/.test(line)) {
        const buf = [];
        while (i < lines.length) {
          const l = lines[i];
          if (/^[ \t]{0,3}>/.test(l)) { buf.push(l.replace(/^[ \t]{0,3}>[ ]?/, "")); i++; continue; }
          if (!isBlank(l) && buf.length && !isBlank(buf[buf.length - 1])) { buf.push(l); i++; continue; }
          break;
        }
        out += "<blockquote>" + parse(buf.join("\n"), ctx) + "</blockquote>";
        continue;
      }

      /* 表 */
      const t = table(lines, i, ctx);
      if (t) { out += t.html; i = t.next; continue; }

      /* リスト */
      if (ITEM.test(line) && /\S/.test(ITEM.exec(line)[4] || "")) {
        const r = list(lines, i, ctx);
        out += r.html; i = r.next; continue;
      }

      /* インデントコードブロック（4スペース、直前が空行のとき） */
      if (/^ {4,}\S/.test(line) && (i === 0 || isBlank(lines[i - 1]))) {
        const buf = [];
        while (i < lines.length && (/^ {4}/.test(lines[i]) || isBlank(lines[i]))) {
          buf.push(lines[i].slice(4)); i++;
        }
        while (buf.length && isBlank(buf[buf.length - 1])) buf.pop();
        out += '<pre><button class="copy" type="button">コピー</button><code>' +
               esc(buf.join("\n")) + "</code></pre>";
        continue;
      }

      /* 生HTMLブロック */
      m = /^[ \t]{0,3}<(\/?)([a-zA-Z][a-zA-Z0-9-]*)/.exec(line);
      if (m && BLOCK_TAGS.test(m[2])) {
        const buf = [];
        while (i < lines.length && !isBlank(lines[i])) { buf.push(lines[i]); i++; }
        out += sanitize(buf.join("\n"));
        continue;
      }

      /* 段落（Setext見出しも判定） */
      const buf = [];
      while (i < lines.length && !isBlank(lines[i])) {
        const l = lines[i];
        if (buf.length) {
          const st = /^[ \t]{0,3}(=+|-{2,})[ \t]*$/.exec(l);
          if (st) {
            const lv = st[1][0] === "=" ? 1 : 2;
            const text = buf.join("\n");
            const id = slug(text, ctx.ids);
            ctx.toc.push({ id, lv, text: inline(text, ctx) });
            out += "<h" + lv + ' id="' + id + '"><a class="anchor" href="#' + id + '" aria-hidden="true">#</a>' +
                   inline(text, ctx) + "</h" + lv + ">";
            i++; buf.length = 0; break;
          }
          if (FENCE.test(l) || /^[ \t]{0,3}(#{1,6}[ \t]|>)/.test(l) ||
              (ITEM.test(l) && /\S/.test(ITEM.exec(l)[4] || "")) ||
              (/\|/.test(l) && isDivider(lines[i + 1] || ""))) break;
        }
        buf.push(l); i++;
      }
      if (buf.length) out += "<p>" + inline(buf.join("\n"), ctx) + "</p>";
    }
    return out;
  }

  /* -------------------------------------------------------------- 後処理 */
  function sanitize(html) {
    return html
      .replace(/<\s*(script|iframe|object|embed|form|link|meta|style|base)\b[\s\S]*?(<\/\s*\1\s*>|$)/gi, "")
      .replace(/<\s*\/?\s*(script|iframe|object|embed|form|link|meta|style|base)\b[^>]*>/gi, "")
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "")
      .replace(/(href|src)\s*=\s*("|')?\s*(javascript|vbscript):[^"'\s>]*/gi, '$1="#"');
  }

  function frontMatter(src) {
    const m = /^﻿?---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(src);
    if (!m) return { meta: null, body: src };
    const meta = [];
    m[1].split("\n").forEach(l => {
      const kv = /^([A-Za-z_][\w .-]*)\s*:\s*(.*)$/.exec(l);
      if (kv) meta.push([kv[1], kv[2].replace(/^["']|["']$/g, "")]);
      else if (/^\s*-\s+/.test(l) && meta.length) meta[meta.length - 1][1] += (meta[meta.length - 1][1] ? ", " : "") + l.replace(/^\s*-\s+/, "");
    });
    return { meta, body: src.slice(m[0].length) };
  }

  /* ---------------------------------------------------------------- 公開 */
  function render(src, opts) {
    opts = opts || {};
    let text = String(src).replace(/^﻿/, "").replace(/\r\n?/g, "\n");
    const fm = frontMatter(text);
    text = fm.body;

    const ctx = {
      refs: {}, ids: new Set(), toc: [],
      footnotes: {}, footnoteOrder: [],
      breaks: !!opts.breaks, numAlign: opts.numAlign !== false
    };

    /* 参照定義と脚注定義を先に回収 */
    const kept = [];
    const src2 = text.split("\n");
    let inFence = false, fenceRe = null;
    for (let i = 0; i < src2.length; i++) {
      const l = src2[i];
      const f = FENCE.exec(l);
      if (!inFence && f) { inFence = true; fenceRe = new RegExp("^[ \\t]{0,3}" + f[2][0] + "{" + f[2].length + ",}[ \\t]*$"); kept.push(l); continue; }
      if (inFence) { if (fenceRe.test(l)) inFence = false; kept.push(l); continue; }

      let m = /^[ \t]{0,3}\[\^([^\]\s]+)\]:[ \t]*(.*)$/.exec(l);
      if (m) {
        const body = [m[2]];
        while (i + 1 < src2.length && (/^[ \t]{2,}\S/.test(src2[i + 1]) || (!isBlank(src2[i + 1]) && !/^[ \t]{0,3}\[/.test(src2[i + 1]) && /^[ \t]+/.test(src2[i + 1])))) {
          body.push(src2[++i].trim());
        }
        ctx.footnotes[m[1]] = body.join("\n");
        continue;
      }
      m = /^[ \t]{0,3}\[([^\^\]]+)\]:[ \t]*(\S+)(?:[ \t]+["'(](.*)["')])?[ \t]*$/.exec(l);
      if (m) { ctx.refs[m[1].toLowerCase()] = { href: m[2], title: m[3] || "" }; continue; }
      kept.push(l);
    }

    let html = parse(kept.join("\n"), ctx);

    /* 脚注セクション */
    if (ctx.footnoteOrder.length) {
      let fn = '<section class="footnotes"><ol>';
      ctx.footnoteOrder.forEach(id => {
        fn += '<li id="fn-' + esc(id) + '">' + parse(ctx.footnotes[id] || "", ctx) +
              ' <a href="#fnref-' + esc(id) + '" title="本文へ戻る">↩</a></li>';
      });
      html += fn + "</ol></section>";
    }

    /* フロントマター */
    let fmHtml = "";
    if (fm.meta && fm.meta.length) {
      fmHtml = '<div class="fm"><dl>' + fm.meta.map(([k, v]) =>
        "<dt>" + esc(k) + "</dt><dd>" + inline(esc(v).replace(/&amp;/g, "&"), ctx) + "</dd>").join("") + "</dl></div>";
    }

    return { html: fmHtml + sanitize(html), toc: ctx.toc, meta: fm.meta };
  }

  return { render, escapeHtml: esc };
})();

/* ============================================================================
 *  app.js  —  ビューア本体
 * ==========================================================================*/
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("mdv." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("mdv." + k, JSON.stringify(v)); } catch (e) {} }
  };

  const els = {
    main: $("#main"), reader: $(".reader"), content: $("#content"), empty: $("#empty"),
    toc: $("#toc"), files: $("#fileList"), title: $("#docTitle"), meta: $("#docMeta"),
    drop: $("#dropzone"), toast: $("#toast"), picker: $("#picker"), pop: $("#pop"),
    grid: $("#bodyGrid")
  };

  const state = {
    docs: [],          /* {name, size, text, handle?, mtime?} */
    active: -1,
    opts: {
      breaks:  store.get("breaks", false),
      numAlign:store.get("numAlign", true),
      size:    store.get("size", 16),
      width:   store.get("width", "w-normal"),
      theme:   store.get("theme", "auto"),
      sidebar: store.get("sidebar", true),
      watch:   false
    }
  };

  /* ------------------------------------------------------------ UI 初期化 */
  function applyOpts() {
    document.documentElement.dataset.theme = state.opts.theme;
    document.documentElement.style.setProperty("--fs", state.opts.size + "px");
    els.reader.classList.remove("w-narrow", "w-normal", "w-wide");
    els.reader.classList.add(state.opts.width);
    els.grid.classList.toggle("no-side", !state.opts.sidebar);
    $("#btnSide").setAttribute("aria-pressed", String(state.opts.sidebar));
    $("#swBreaks").setAttribute("aria-pressed", String(state.opts.breaks));
    $("#swNum").setAttribute("aria-pressed", String(state.opts.numAlign));
    document.querySelectorAll("#segSize button").forEach(b =>
      b.classList.toggle("on", +b.dataset.v === +state.opts.size));
    document.querySelectorAll("#segWidth button").forEach(b =>
      b.classList.toggle("on", b.dataset.v === state.opts.width));
  }

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => els.toast.classList.remove("on"), 1900);
  }

  /* --------------------------------------------------------------- 描画 */
  function render() {
    const doc = state.docs[state.active];
    if (!doc) {
      els.empty.hidden = false; els.reader.hidden = true;
      els.title.innerHTML = ""; els.toc.innerHTML = '<div class="side-empty">見出しがここに並びます</div>';
      return;
    }
    els.empty.hidden = true; els.reader.hidden = false;

    const t0 = performance.now();
    const res = MD.render(doc.text, state.opts);
    els.content.innerHTML = res.html;
    const ms = Math.max(1, Math.round(performance.now() - t0));

    /* タイトル */
    const h1 = els.content.querySelector("h1");
    document.title = (h1 ? h1.textContent.replace(/^#/, "") : doc.name) + " — Markdown Viewer";
    els.title.innerHTML = "<b>" + MD.escapeHtml(doc.name) + "</b>";

    /* 目次 */
    if (res.toc.length) {
      els.toc.innerHTML = res.toc.map(h =>
        '<a href="#' + h.id + '" class="lv' + h.lv + '" data-id="' + h.id + '">' +
        h.text.replace(/<[^>]+>/g, "") + "</a>").join("");
    } else {
      els.toc.innerHTML = '<div class="side-empty">見出しはありません</div>';
    }

    /* 文書メタ */
    const chars = doc.text.length;
    const words = (doc.text.match(/[A-Za-z0-9_]+|[぀-ヿ一-鿿]/g) || []).length;
    els.meta.innerHTML = [
      MD.escapeHtml(doc.name),
      fmtSize(doc.size),
      chars.toLocaleString() + " 文字",
      "約 " + Math.max(1, Math.round(words / 500)) + " 分で読了",
      res.toc.length + " 見出し",
      els.content.querySelectorAll("table").length + " 表 / " +
      els.content.querySelectorAll("pre").length + " コードブロック",
      "描画 " + ms + "ms"
    ].map(s => "<span>" + s + "</span>").join("");

    els.main.scrollTop = 0;
    renderFiles();
    hookCopy();
    spy();
  }

  const fmtSize = n => n < 1024 ? n + " B" : n < 1048576
    ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB";

  function renderFiles() {
    if (!state.docs.length) {
      els.files.innerHTML = '<div class="side-empty">まだ開いていません</div>';
      return;
    }
    els.files.innerHTML = state.docs.map((d, i) =>
      '<button class="file-item' + (i === state.active ? " active" : "") + '" data-i="' + i + '">' +
      '<span class="nm" title="' + MD.escapeHtml(d.name) + '">' + MD.escapeHtml(d.name) + "</span>" +
      '<span class="x" data-close="' + i + '" title="閉じる">×</span></button>').join("");
  }

  function hookCopy() {
    els.content.querySelectorAll("pre .copy").forEach(btn => {
      btn.addEventListener("click", () => {
        const code = btn.parentElement.querySelector("code").textContent;
        navigator.clipboard.writeText(code)
          .then(() => { btn.textContent = "コピーしました"; toast("コードをコピーしました");
                        setTimeout(() => btn.textContent = "コピー", 1400); })
          .catch(() => toast("コピーできませんでした"));
      });
    });
  }

  /* ------------------------------------------------------ 目次スクロール追従 */
  let heads = [];
  function spy() {
    heads = [...els.content.querySelectorAll("h1,h2,h3,h4,h5,h6")];
    onScroll();
  }
  function onScroll() {
    if (!heads.length) return;
    const top = els.main.scrollTop + 90;
    let cur = heads[0];
    for (const h of heads) { if (h.offsetTop <= top) cur = h; else break; }
    els.toc.querySelectorAll("a").forEach(a =>
      a.classList.toggle("on", a.dataset.id === cur.id));
  }
  els.main.addEventListener("scroll", () => {
    clearTimeout(onScroll._t);
    onScroll._t = setTimeout(onScroll, 60);
  });

  /* ------------------------------------------------------------ ファイル */
  const OK = /\.(md|markdown|mkd|mdown|mdx|txt|text)$/i;

  function addDoc(name, text, size, handle) {
    const idx = state.docs.findIndex(d => d.name === name);
    const doc = { name, text, size: size != null ? size : new Blob([text]).size, handle };
    if (idx >= 0) { state.docs[idx] = doc; state.active = idx; }
    else { state.docs.push(doc); state.active = state.docs.length - 1; }
    render();
  }

  function readFile(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result));
      r.onerror = rej;
      r.readAsText(file, "UTF-8");
    });
  }

  async function openFiles(files) {
    const list = [...files].filter(f => OK.test(f.name) || /text|markdown/.test(f.type) || !f.type);
    if (!list.length) { toast("Markdownファイルではないようです"); return; }
    for (const f of list) {
      try { addDoc(f.name, await readFile(f), f.size); }
      catch (e) { toast(f.name + " を読めませんでした"); }
    }
    toast(list.length + " 件のファイルを開きました");
  }

  /* ドラッグ&ドロップ */
  let dragDepth = 0;
  window.addEventListener("dragenter", e => {
    if (![...(e.dataTransfer.types || [])].includes("Files")) return;
    e.preventDefault(); dragDepth++; els.drop.classList.add("on");
  });
  window.addEventListener("dragover", e => {
    if ([...(e.dataTransfer.types || [])].includes("Files")) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; }
  });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; els.drop.classList.remove("on"); } });
  window.addEventListener("drop", async e => {
    if (!e.dataTransfer) return;
    e.preventDefault(); dragDepth = 0; els.drop.classList.remove("on");
    /* File System Access API が使えるなら handle を保持（自動更新用） */
    const handles = [];
    if (window.showOpenFilePicker && e.dataTransfer.items) {
      for (const it of e.dataTransfer.items) {
        if (it.kind === "file" && it.getAsFileSystemHandle) {
          try { const h = await it.getAsFileSystemHandle(); if (h.kind === "file") handles.push(h); } catch (err) {}
        }
      }
    }
    if (handles.length) {
      for (const h of handles) {
        try {
          const f = await h.getFile();
          if (!OK.test(f.name)) continue;
          addDoc(f.name, await readFile(f), f.size, h);
        } catch (err) {}
      }
      if (state.docs.length) { toast(handles.length + " 件のファイルを開きました"); return; }
    }
    openFiles(e.dataTransfer.files);
  });

  /* ペースト */
  window.addEventListener("paste", e => {
    if (/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) return;
    const f = [...(e.clipboardData.files || [])];
    if (f.length) { openFiles(f); return; }
    const t = e.clipboardData.getData("text/plain");
    if (t && t.trim()) { addDoc("クリップボード.md", t); toast("クリップボードから読み込みました"); }
  });

  /* ------------------------------------------------------------ 自動更新 */
  setInterval(async () => {
    if (!state.opts.watch) return;
    const doc = state.docs[state.active];
    if (!doc || !doc.handle) return;
    try {
      const f = await doc.handle.getFile();
      if (doc.mtime && f.lastModified === doc.mtime) return;
      const first = !doc.mtime;
      doc.mtime = f.lastModified;
      if (first) return;
      const y = els.main.scrollTop;
      doc.text = await readFile(f); doc.size = f.size;
      render(); els.main.scrollTop = y;
      toast("ファイルの更新を反映しました");
    } catch (e) {}
  }, 1200);

  /* -------------------------------------------------------------- 操作系 */
  els.picker.addEventListener("change", e => { openFiles(e.target.files); e.target.value = ""; });
  const pick = () => els.picker.click();
  $("#btnOpen").addEventListener("click", pick);
  $("#btnOpen2").addEventListener("click", pick);
  $("#btnPrint").addEventListener("click", () => window.print());

  $("#btnSide").addEventListener("click", () => {
    state.opts.sidebar = !state.opts.sidebar; store.set("sidebar", state.opts.sidebar); applyOpts();
  });
  $("#btnTheme").addEventListener("click", () => {
    const order = ["auto", "light", "dark"];
    state.opts.theme = order[(order.indexOf(state.opts.theme) + 1) % 3];
    store.set("theme", state.opts.theme); applyOpts();
    toast("テーマ: " + { auto: "自動", light: "ライト", dark: "ダーク" }[state.opts.theme]);
  });
  $("#btnCfg").addEventListener("click", e => { e.stopPropagation(); els.pop.classList.toggle("on"); });
  document.addEventListener("click", e => {
    if (!els.pop.contains(e.target) && e.target !== $("#btnCfg")) els.pop.classList.remove("on");
  });

  $("#segSize").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.opts.size = +b.dataset.v; store.set("size", state.opts.size); applyOpts();
  });
  $("#segWidth").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.opts.width = b.dataset.v; store.set("width", state.opts.width); applyOpts();
  });
  $("#swBreaks").addEventListener("click", () => {
    state.opts.breaks = !state.opts.breaks; store.set("breaks", state.opts.breaks); applyOpts(); render();
  });
  $("#swNum").addEventListener("click", () => {
    state.opts.numAlign = !state.opts.numAlign; store.set("numAlign", state.opts.numAlign); applyOpts(); render();
  });
  $("#swWatch").addEventListener("click", e => {
    state.opts.watch = !state.opts.watch;
    e.currentTarget.setAttribute("aria-pressed", String(state.opts.watch));
    toast(state.opts.watch
      ? "自動更新オン（ドロップしたファイルを監視します）"
      : "自動更新オフ");
  });

  els.files.addEventListener("click", e => {
    const x = e.target.closest("[data-close]");
    if (x) {
      e.stopPropagation();
      const i = +x.dataset.close;
      state.docs.splice(i, 1);
      if (state.active >= state.docs.length) state.active = state.docs.length - 1;
      render(); return;
    }
    const b = e.target.closest(".file-item");
    if (b) { state.active = +b.dataset.i; render(); }
  });
  $("#btnClear").addEventListener("click", () => { state.docs = []; state.active = -1; render(); });

  els.toc.addEventListener("click", e => {
    const a = e.target.closest("a"); if (!a) return;
    e.preventDefault();
    const el = document.getElementById(a.dataset.id);
    if (el) els.main.scrollTo({ top: el.offsetTop - 24, behavior: "smooth" });
  });
  els.content.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
    if (el) { e.preventDefault(); els.main.scrollTo({ top: el.offsetTop - 24, behavior: "smooth" }); }
  });

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === "o") { e.preventDefault(); pick(); }
      if (e.key === "b") { e.preventDefault(); $("#btnSide").click(); }
    }
    if (e.key === "Escape") els.pop.classList.remove("on");
  });

  /* -------------------------------------------------------------- サンプル */
  const DEMO = [
    "---",
    "title: Markdown Viewer のサンプル",
    "author: あなた",
    "updated: 2026-08-20",
    "---",
    "",
    "# 見出し1 — このビューアでできること",
    "",
    "ドラッグ&ドロップした Markdown を、**インデント**と**表**が読みやすい形で表示します。",
    "外部ライブラリを使わない単一 HTML なので、ダブルクリックで開くだけで動きます。",
    "",
    "## 表は横スクロール・ヘッダ固定・数値の自動右寄せ",
    "",
    "| 項目 | 内容 | 対応 | 件数 |",
    "|------|------|:----:|-----:|",
    "| 見出し | `#` 〜 `######` と Setext 形式 | ○ | 6 |",
    "| リスト | 箇条書き / 番号付き / タスク | ○ | 3 |",
    "| 表 | 列ごとの寄せ、`|` のエスケープ | ○ | 1,024 |",
    "| コード | フェンス・インデント両対応 | ○ | 128 |",
    "| リンク | インライン・参照・自動リンク | ○ | 12 |",
    "",
    "## インデントは深さが一目でわかる",
    "",
    "- 第1階層",
    "  - 第2階層（縦のガイド線が入ります）",
    "    - 第3階層",
    "      1. 番号付きも混ぜられます",
    "      2. 深さに応じてマーカーが変わります",
    "         - さらに深く",
    "- タスクリスト",
    "  - [x] 完了したもの",
    "  - [ ] これから",
    "",
    "1. 手順の1つ目",
    "1. 手順の2つ目",
    "",
    "   段落を含む項目も、インデントを保ったまま表示されます。",
    "",
    "1. 手順の3つ目",
    "",
    "## 引用とコード",
    "",
    "> 引用は左のバーで区切ります。",
    "> > 入れ子の引用も段差がつきます。",
    "",
    "```js",
    "// コードブロックは言語ラベルとコピーボタン付き",
    "function greet(name) {",
    "  const msg = `こんにちは、${name}さん`;",
    "  console.log(msg);",
    "  return msg;",
    "}",
    "```",
    "",
    "行内の `code` や ~~取り消し線~~、==ハイライト==、<kbd>Ctrl</kbd>+<kbd>P</kbd> も使えます[^1]。",
    "",
    "[^1]: 脚注はページ下部にまとめて表示されます。",
    "",
    "---",
    "",
    "### リンク",
    "",
    "[通常のリンク](https://example.com)、参照リンク[こちら][ref]、自動リンク https://example.com",
    "",
    "[ref]: https://example.com"
  ].join("\n");

  $("#btnDemo").addEventListener("click", () => { addDoc("サンプル.md", DEMO); });

  /* -------------------------------------------------------------- 起動 */
  applyOpts();
  render();
})();
</script>
